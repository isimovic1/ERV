spring.application.name=employee-administration
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080

spring.messages.basename=messages
spring.messages.encoding=UTF-8

app.kafka.notification-topic=workforce.notifications
app.notification.sender=evidencija@erv.hr

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.consumer.group-id=workforce-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=hr.algebra.workforce.event
spring.kafka.consumer.properties.spring.json.value.default.type=hr.algebra.workforce.event.NotificationEvent
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.admin.fail-fast=false
spring.kafka.admin.operation-timeout=2s
spring.kafka.admin.close-timeout=2s
spring.kafka.properties.request.timeout.ms=2000
spring.kafka.properties.default.api.timeout.ms=2000
spring.kafka.properties.reconnect.backoff.max.ms=10000

app.jwt.secret=${JWT_SECRET:}
app.jwt.validity-minutes=60

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
