<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Moj profil')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container py-4" style="max-width: 32rem;">

    <div th:if="${message}" class="alert alert-success py-2" th:text="${message}"></div>

    <h1 class="h5 mb-3">Moj profil</h1>

    <dl class="row small mb-4">
        <dt class="col-4">Ime i prezime</dt>
        <dd class="col-8" th:text="${principal.fullName}">Marko Horvat</dd>
        <dt class="col-4">E-pošta</dt>
        <dd class="col-8" th:text="${principal.email}">marko@workforce.hr</dd>
        <dt class="col-4">Uloga</dt>
        <dd class="col-8" th:switch="${principal.role.name()}">
            <span th:case="'ADMIN'">Administrator</span>
            <span th:case="'MANAGER'">Voditelj</span>
            <span th:case="'EMPLOYEE'">Zaposlenik</span>
        </dd>
    </dl>

    <div class="card">
        <div class="card-body">
            <h2 class="h6 mb-3">Promjena lozinke</h2>
            <form th:action="@{/profile/password}" th:object="${passwordChangeForm}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="currentPassword">Trenutna lozinka</label>
                    <input class="form-control" type="password" id="currentPassword"
                           th:field="*{currentPassword}" autocomplete="current-password">
                    <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}"
                         th:errors="*{currentPassword}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">Nova lozinka</label>
                    <input class="form-control" type="password" id="newPassword"
                           th:field="*{newPassword}" autocomplete="new-password">
                    <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}"
                         th:errors="*{newPassword}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Potvrda nove lozinke</label>
                    <input class="form-control" type="password" id="confirmPassword"
                           th:field="*{confirmPassword}" autocomplete="new-password">
                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>
                <button class="btn btn-primary" type="submit">Promijeni lozinku</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
