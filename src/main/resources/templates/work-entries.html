<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Radni sati')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container py-4">

    <div th:if="${message}" class="alert alert-success py-2" th:text="${message}"></div>

    <div class="d-flex align-items-center gap-2 mb-3">
        <a class="btn btn-outline-secondary btn-sm"
           th:href="@{/work-entries(month=${previousMonth})}">&laquo;</a>
        <h1 class="h5 mb-0" th:text="${month}">2026-09</h1>
        <a class="btn btn-outline-secondary btn-sm"
           th:href="@{/work-entries(month=${nextMonth})}">&raquo;</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h6 mb-3" th:text="${workEntryForm.id} != null ? 'Izmjena unosa' : 'Novi unos'">Novi unos</h2>
                    <form th:action="@{/work-entries}" th:object="${workEntryForm}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label" for="workDate">Datum</label>
                            <input class="form-control" type="date" id="workDate" th:field="*{workDate}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('workDate')}"
                                 th:errors="*{workDate}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="hours">Sati</label>
                            <input class="form-control" type="number" step="0.25" id="hours" th:field="*{hours}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('hours')}"
                                 th:errors="*{hours}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="overtimeHours">Prekovremeni sati</label>
                            <input class="form-control" type="number" step="0.25" id="overtimeHours"
                                   th:field="*{overtimeHours}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('overtimeHours')}"
                                 th:errors="*{overtimeHours}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="description">Opis</label>
                            <textarea class="form-control" rows="2" id="description" th:field="*{description}"></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}"></div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Spremi</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <table class="table table-sm align-middle">
                <thead>
                <tr>
                    <th>Datum</th>
                    <th class="text-end">Sati</th>
                    <th class="text-end">Prekovremeni</th>
                    <th>Opis</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${summary.entries}">
                    <td th:text="${#temporals.format(row.workDate, 'dd.MM.yyyy.')}">01.09.2026.</td>
                    <td class="text-end" th:text="${row.hours}">8</td>
                    <td class="text-end" th:text="${row.overtimeHours}">0</td>
                    <td th:text="${row.description}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/work-entries/{id}/edit(id=${row.id}, month=${month})}">Izmijeni</a>
                        <form class="d-inline" method="post"
                              th:action="@{/work-entries/{id}/delete(id=${row.id}, month=${month})}">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Obriši</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${summary.entries.isEmpty()}">
                    <td colspan="5" class="text-muted">Nema unosa za odabrani mjesec.</td>
                </tr>
                </tbody>
                <tfoot th:if="${!summary.entries.isEmpty()}">
                <tr class="fw-semibold">
                    <td th:text="${summary.recordedDays} + (${summary.recordedDays % 10 == 1 and summary.recordedDays % 100 != 11} ? ' dan' : ' dana')">0 dana</td>
                    <td class="text-end" th:text="${summary.totalHours}">0</td>
                    <td class="text-end" th:text="${summary.totalOvertimeHours}">0</td>
                    <td colspan="2"></td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
</body>
</html>
