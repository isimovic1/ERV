<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Kalendar odsutnosti')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container-fluid py-4">

    <div class="d-flex align-items-center gap-2 mb-3">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/team/calendar(month=${previousMonth})}">&laquo;</a>
        <h1 class="h5 mb-0" th:text="${month}">2026-09</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/team/calendar(month=${nextMonth})}">&raquo;</a>
    </div>

    <div class="d-flex flex-wrap gap-3 mb-3 small">
        <span><span class="legend bg-primary"></span> Godišnji</span>
        <span><span class="legend bg-primary-subtle"></span> Godišnji (u odobravanju)</span>
        <span><span class="legend bg-info"></span> Plaćeni dopust</span>
        <span><span class="legend bg-info-subtle"></span> Plaćeni dopust (u odobravanju)</span>
        <span><span class="legend bg-warning"></span> Bolovanje</span>
        <span><span class="legend bg-secondary-subtle"></span> Vikend</span>
        <span><span class="legend bg-success-subtle"></span> Praznik</span>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-sm align-middle calendar">
            <thead>
            <tr>
                <th class="employee-column">Zaposlenik</th>
                <th class="text-center" th:each="day : ${calendar.days}"
                    th:classappend="${day.dayOfWeek.value >= 6} ? 'table-secondary'"
                    th:text="${day.dayOfMonth}">1</th>
                <th class="text-center">Σ</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${calendar.rows}">
                <td class="employee-column" th:text="${row.employeeName}">Marko Horvat</td>
                <td th:each="cell : ${row.days}" th:switch="${cell.kind.name()}"
                    th:title="${#temporals.format(cell.date, 'dd.MM.yyyy.')}">
                    <span th:case="'ANNUAL_LEAVE'" class="cell bg-primary"></span>
                    <span th:case="'ANNUAL_LEAVE_PENDING'" class="cell bg-primary-subtle"></span>
                    <span th:case="'PAID_LEAVE'" class="cell bg-info"></span>
                    <span th:case="'PAID_LEAVE_PENDING'" class="cell bg-info-subtle"></span>
                    <span th:case="'SICK_LEAVE'" class="cell bg-warning"></span>
                    <span th:case="'HOLIDAY'" class="cell bg-success-subtle"></span>
                    <span th:case="'WEEKEND'" class="cell bg-secondary-subtle"></span>
                    <span th:case="*" class="cell"></span>
                </td>
                <td class="text-center fw-semibold" th:text="${row.absentDays}">0</td>
            </tr>
            <tr th:if="${calendar.rows.isEmpty()}">
                <td colspan="33" class="text-muted">Nema zaposlenika za prikaz.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<style>
    .calendar td, .calendar th {
        padding: 2px;
        font-size: 0.75rem;
    }

    .calendar .employee-column {
        min-width: 11rem;
        padding-left: 8px;
        font-size: 0.85rem;
        white-space: nowrap;
    }

    .calendar .cell {
        display: block;
        width: 100%;
        height: 1.4rem;
        border-radius: 2px;
    }

    .legend {
        display: inline-block;
        width: 0.9rem;
        height: 0.9rem;
        border-radius: 2px;
        vertical-align: text-bottom;
        border: 1px solid rgba(0, 0, 0, 0.1);
    }
</style>
</body>
</html>
