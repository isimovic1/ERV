<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Bolovanje')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container py-4">

    <div th:if="${message}" class="alert alert-success py-2" th:text="${message}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger py-2" th:text="${errorMessage}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h6 mb-3">Prijava bolovanja</h2>
                    <form th:action="@{/sick-leaves}" th:object="${sickLeaveForm}" method="post"
                          enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label" for="startDate">Od</label>
                            <input class="form-control" type="date" id="startDate" th:field="*{startDate}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('startDate')}"
                                 th:errors="*{startDate}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="endDate">Do</label>
                            <input class="form-control" type="date" id="endDate" th:field="*{endDate}">
                            <div class="form-text">Ostavite prazno ako bolovanje još traje.</div>
                            <div class="text-danger small" th:if="${#fields.hasErrors('endDate')}"
                                 th:errors="*{endDate}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="documentReference">Oznaka doznake</label>
                            <input class="form-control" type="text" id="documentReference"
                                   th:field="*{documentReference}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('documentReference')}"
                                 th:errors="*{documentReference}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="description">Opis</label>
                            <textarea class="form-control" rows="2" id="description" th:field="*{description}"></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="attachment">Potvrda (PDF, JPEG ili PNG)</label>
                            <input class="form-control" type="file" id="attachment" name="attachment"
                                   accept="application/pdf,image/jpeg,image/png">
                            <div class="form-text">Najviše 5 MB.</div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Prijavi</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <table class="table table-sm align-middle">
                <thead>
                <tr>
                    <th>Od</th>
                    <th>Do</th>
                    <th>Status</th>
                    <th>Doznaka</th>
                    <th>Potvrda</th>
                    <th>Zatvaranje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${leaves}">
                    <td th:text="${#temporals.format(row.startDate, 'dd.MM.yyyy.')}">01.09.2026.</td>
                    <td th:text="${row.endDate} != null ? ${#temporals.format(row.endDate, 'dd.MM.yyyy.')} : '—'">—</td>
                    <td th:switch="${row.status.name()}">
                        <span th:case="'REPORTED'" class="badge text-bg-warning">Prijavljeno</span>
                        <span th:case="'CONFIRMED'" class="badge text-bg-info">Potvrđeno</span>
                        <span th:case="'CLOSED'" class="badge text-bg-secondary">Zatvoreno</span>
                    </td>
                    <td class="small" th:text="${row.documentReference}"></td>
                    <td>
                        <a th:if="${row.hasAttachment}" class="btn btn-outline-secondary btn-sm"
                           th:href="@{/sick-leaves/{id}/attachment(id=${row.id})}">Preuzmi</a>
                        <span th:unless="${row.hasAttachment}" class="text-muted small">—</span>
                    </td>
                    <td>
                        <form th:if="${row.status.name() != 'CLOSED'}" class="d-flex gap-2" method="post"
                              th:action="@{/sick-leaves/{id}/close(id=${row.id})}">
                            <input class="form-control form-control-sm" type="date" name="endDate" required>
                            <button class="btn btn-outline-secondary btn-sm text-nowrap" type="submit">Zatvori</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${leaves.isEmpty()}">
                    <td colspan="6" class="text-muted">Nema prijavljenih bolovanja.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
